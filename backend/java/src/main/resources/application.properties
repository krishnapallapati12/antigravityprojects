server.port=8082
spring.application.name=jaikrishnaram-resort-service

# Database Configuration (MySQL with automated H2 fallback)
spring.datasource.url=jdbc:mysql://localhost:3306/jaikrishnaram_resort?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root_secure_password_2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Swagger OpenAPI docs
springdoc.swagger-ui.path=/swagger-ui.html

