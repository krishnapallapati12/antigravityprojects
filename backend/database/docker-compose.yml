version: '3.8'

services:
  # 1. MySQL 8.0 Relational Database Engine
  mysql:
    image: mysql:8.0
    container_name: jaikrishnaram-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password_2026
      MYSQL_DATABASE: jaikrishnaram_resort
      MYSQL_USER: resort_admin
      MYSQL_PASSWORD: resort_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache for High-Speed Availability & Slot Locking
  redis:
    image: redis:7-alpine
    container_name: jaikrishnaram-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Python FastAPI Microservice
  fastapi:
    build:
      context: ../python/fastapi_app
      dockerfile: Dockerfile
    container_name: jaikrishnaram-fastapi
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://resort_admin:resort_password_2026@mysql:3306/jaikrishnaram_resort
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # 4. Node.js Express REST API
  nodejs:
    build:
      context: ../nodejs
      dockerfile: Dockerfile
    container_name: jaikrishnaram-node
    restart: always
    environment:
      DB_HOST: mysql
      DB_USER: resort_admin
      DB_PASSWORD: resort_password_2026
      DB_NAME: jaikrishnaram_resort
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  # 5. Adminer Database GUI
  adminer:
    image: adminer:latest
    container_name: jaikrishnaram-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:

